    expected_points:
      - "打卡時間小於等於應到班時間加緩衝為準時（normal），超過即為遲到（late）"
      - "判定粒度是分鐘不是秒，09:10:00 與 09:10:59 結果相同"
      - "09:11:00 才算遲到"

  - question: "下班打卡有沒有緩衝時間可以用？"
