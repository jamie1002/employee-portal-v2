    expected_points:
      - "午休區間隨到班偏移量同步平移，09:05 到班則午休為 12:05–13:05"
      - "平移量夾在正負緩衝之內"
      - "請假時數計算的午休固定不浮動，與出勤打卡的浮動午休刻意不同"

  - question: "當天的正常工時結束時間是怎麼算出來的？"
    category: policy
    expected_section_path: "出勤與申請作業規則 > 2. 上下班打卡 > 2.4 正常工時結束時間"
    expected_points:
      - "取封頂式與累積式兩者的較小者"
      - "封頂式＝表定下班時間＋到班偏移量"
      - "累積式＝工時起算點＋當日應工時＋午休長度－當日已核准請假時數"

  - question: "早退有沒有寬限？只早 1 分鐘下班算不算早退？"
    category: policy
    expected_section_path: "出勤與申請作業規則 > 2. 上下班打卡 > 2.5 早退判定"
    expected_points:
      - "早退沒有任何寬限，早 1 分鐘就是早退"
      - "表定下班 18:00、09:00 準時上班時，17:55 打下班卡一樣算早退"
      - "遲到與早退是兩個獨立判定，可以同時成立"

  - question: "超過正常工時結束時間之後多留的那段時間，會算進當日工時嗎？"
