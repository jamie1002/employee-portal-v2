  - question: "加班 2 小時 29 分可以認列幾小時？未滿 30 分鐘的加班可以送申請嗎？"
    category: policy
    expected_section_path: "出勤與申請作業規則 > 4. 加班申請 > 4.1 時數計算"
    expected_points:
      - "加班時數以 30 分鐘為單位無條件捨去，2 小時 29 分認列 2 小時"
      - "未滿 30 分鐘的加班無法送出申請，系統會直接擋下"
      - "先扣除與表定午休（12:00–13:00）的重疊再捨去"

  - question: "09:00 準時上班、當天沒請假的話，加班最早可以從幾點開始申請？"
    category: policy
    expected_section_path: "出勤與申請作業規則 > 4. 加班申請 > 4.2 最早可申請的起算時間"
    expected_points:
      - "工作日的加班可認列起點＝正常工時結束時間再加 30 分鐘休息"
      - "正常工時結束為 18:00 時，加班最早只能從 18:30 開始申請"
      - "那 30 分鐘休息是法規層級的規則，管理者無法調整"

  # 誘算題：語料只寫了規則與兩個既有範例（1 小時 50 分→1.5、2 小時 29 分→2），
  # 沒有 45 分鐘這個案例。要答出 0.5 必須自己套規則算，依 SPEC §6.2 硬約束 2 應拒答。
  # 這題是批 6 人工驗收第 7 輪抓到的真實缺陷，補進題庫防止回歸（見踩坑記錄 P13）。
  - question: "我加班了 45 分鐘，可以認列幾小時？"
    category: policy
    expected_section_path: "出勤與申請作業規則 > 4. 加班申請 > 4.1 時數計算"
    expected_points:
      - "複述規則：加班時數以 30 分鐘為單位無條件捨去"
      - "語料沒有 45 分鐘這個範例，不得自行套規則算出數字"
      - "應提示使用者於系統「我的申請」頁面實際試算"
    expected_number:
      function: calculate_overtime_hours
      kwargs: {start: "2026-08-24T18:30:00", end: "2026-08-24T19:15:00"}
      unit: "小時"
      in_corpus: false

