# 黃金題庫（`SPEC.md` §7.1、`TASKS.md` 批 5）
#
# 設計原則：
# 1. **先寫題庫、再看結果**。每一題的 expected_section_path 都是「讀語料判斷答案該在哪一節」
#    寫出來的，不是「跑完檢索看回傳什麼就填什麼」——後者會讓 eval 永遠 100% 但毫無意義。
# 2. **涵蓋每一個章節**：四份語料切出 61 個 chunk、54 個不同的 section_path，
#    每一個 section_path 都至少有一題（`SPEC.md` §7.2 第 2 點）。Q&A 章節的每一題問答對
#    各自有一題對應。
# 3. **數字型題目一律不手填期望值**：以 expected_number 宣告要呼叫 employee-portal-v2 的
#    哪一個業務函式、帶什麼參數，由 `run_eval.py` 執行時即時算出（`SPEC.md` §7.1 最後一項）。
#    語料被改壞或 v2 規則變更時，eval 會立刻紅。
#
# 欄位說明：
#   question              必填。使用者可能會問的問題。
#   expected_section_path 期望命中的章節路徑；誘導題若語料完全沒有對應章節則留空（null）。
#   expected_points       期望答案要點（人工／AI 逐句對照用，也是批 6 生成端的驗收依據）。
#   expect_refusal        true 代表這是誘導題，期望機器人明確拒答／說明不在文件範圍。
#   expected_number       數字型題目的 ground truth 來源宣告：
#     function              special_leave_days | calculate_leave_hours
#     kwargs                傳給該函式的參數（時間一律台北時區，落在展示視窗 2026-08-24～08-31）
#     unit                  單位（用來組出「{值} {單位}」字串，例如「14 日」「5 小時」）
#     in_corpus             這個數字**有沒有**白紙黑字寫在語料裡。兩種值的檢查方向相反：
#       true  → 語料寫死了這個數字。eval 會檢查 (a) 語料與 v2 函式算出來的一致、
#               (b) 機器人的回答有把這個數字講出來。
#       false → 語料沒有寫這個數字，要得到它必須自己做算術。依 `SPEC.md` §6.2 硬約束第 2 條，
#               機器人**不得自行計算未出現在文件中的數字**，所以 eval 反過來要求
#               **回答裡不可以出現這個數字**——出現就代表它自己算了，是本專案最危險的失敗模式。

questions:
