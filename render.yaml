services:
  - type: web
    name: employee-portal-api
    env: python
    rootDir: backend
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN_HOURS
        value: "24"
      - key: APP_TIMEZONE
        value: Asia/Taipei
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_RESET_IDLE_MINUTES
        value: "15"
      # AI 政策問答（批 A）。GOOGLE_API_KEY 需先在 Neon 手動跑過 migrate + ingest
      # 才能 merge 部署（docs/PITFALLS.md G4：push 不會自動更新雲端資料庫）。
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REQUESTS_PER_MINUTE
        value: "10"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "25"
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: RETRIEVAL_TOP_K
        value: "5"
      - key: RETRIEVAL_MIN_SCORE
        value: "0.65"
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CHAT_MAX_QUESTION_CHARS
        value: "500"
