# postgres-dev/postgres-test 兩個 service 都用 pgvector/pgvector:pg16（而非官方
# postgres:16）：AI 政策問答功能需要 pgvector extension，換影像後需要
# `docker compose up -d --force-recreate` 讓既有容器換上新影像（既有 volume 相容，
# 資料不會遺失）。見 openspec/changes/add-policy-chat/design.md Decision 5。
services:
  postgres-dev:
    image: pgvector/pgvector:pg16
    container_name: employee-portal-v2-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_portal
    ports:
      # 舊專案（employee-portal）的 docker-compose 仍佔用主機 5432/5433，
      # 這裡改用 5442/5443 避免衝突，兩個專案可同時開著互相對照。
      - "5442:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: employee-portal-v2-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_portal_test
    ports:
      - "5443:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev-data:
  postgres-test-data:
