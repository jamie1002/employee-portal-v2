name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JWT_SECRET: ci-test-secret-not-for-production
  APP_TIMEZONE: Asia/Taipei
  CORS_ORIGINS: http://localhost:5173

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/employee_portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝後端依賴
        run: pip install -r backend/requirements.txt
      - name: 執行後端測試
        run: cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝依賴
        run: npm install
      - name: 執行前端測試
        run: npm run test:frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/employee_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝依賴
        run: |
          npm install
          pip install -r backend/requirements.txt
      - name: 安裝 Playwright 瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 重置資料庫（migrate + seed）
        run: npm run db:reset
      - name: 執行 e2e 測試
        run: npm run test:e2e
      - name: 上傳失敗診斷資料
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # 實際輸出在專案根目錄的 test-results/，不是 e2e/test-results
          # （前一版在這裡設錯路徑，導致從來沒真的收集到診斷資料，見 docs/PITFALLS.md G6）
          path: |
            playwright-report/
            test-results/
          retention-days: 7
